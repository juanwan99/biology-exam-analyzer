services:
  # PostgreSQL + pgvector 数据库
  postgres:
    image: pgvector/pgvector:pg16
    container_name: biology_postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=biology
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      - POSTGRES_DB=biology_edu
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biology -d biology_edu"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: biology_backend
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - ./backend:/app  # Python代码实时同步，修改后只需重启容器
      - ./logs:/app/logs
      - ./backend/prompts:/app/prompts
      - ./prompts:/app/subject_prompts  # 多学科 prompt 模板
      - ./uploads:/app/uploads
      - ./backend/rules:/app/rules
      - ./.secrets:/app/.secrets:ro
      - ./reports:/app/reports
    environment:
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - LOG_LEVEL=INFO
      - DATABASE_URL=postgresql://biology:${POSTGRES_PASSWORD:-biology123}@postgres:5432/biology_edu
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS}
      - VERTEX_AI_PROJECT=${VERTEX_AI_PROJECT}
      - HTTPS_PROXY=${HTTPS_PROXY}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    build: ./frontend
    container_name: biology_frontend
    ports:
      - "127.0.0.1:3001:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
